name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

defaults:
  run:
    working-directory: bb

jobs:
  # Build all binaries and archives using GoReleaser
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: 'bb/go.mod'

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean --skip=publish
          workdir: bb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          if-no-files-found: error
          retention-days: 7
          path: |
            bb/dist/*.tar.gz
            bb/dist/*.zip
            bb/dist/*.deb
            bb/dist/*.rpm

      - name: Upload macOS binaries for PKG build
        uses: actions/upload-artifact@v7
        with:
          name: macos-binaries
          if-no-files-found: error
          retention-days: 7
          path: |
            bb/dist/macos_darwin_*/

      - name: Upload Windows binaries for MSI build
        uses: actions/upload-artifact@v7
        with:
          name: windows-binaries
          if-no-files-found: error
          retention-days: 7
          path: |
            bb/dist/windows_windows_*/

  # Build macOS PKG installer
  macos-pkg:
    needs: build
    runs-on: macos-latest
    defaults:
      run:
        working-directory: bb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: macos-binaries
          path: bb/dist

      - name: Debug artifact structure
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Full workspace structure ==="
          find . -name "bb" -type f 2>/dev/null | head -20
          echo "=== bb/dist contents ==="
          ls -laR bb/dist/ 2>/dev/null || echo "No bb/dist"
          echo "=== Checking expected paths ==="
          ls -la bb/dist/macos_darwin_arm64/ 2>/dev/null || echo "No arm64"
          ls -la bb/dist/macos_darwin_amd64_v1/ 2>/dev/null || echo "No amd64"

      - name: Build PKG installer
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          chmod +x script/pkgmacos
          script/pkgmacos "$TAG_NAME"

      - name: Upload PKG
        uses: actions/upload-artifact@v7
        with:
          name: macos-pkg
          if-no-files-found: error
          retention-days: 7
          path: bb/dist/*.pkg

  # Build Windows MSI installer
  windows-msi:
    needs: build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bb
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          name: windows-binaries
          path: bb/dist

      - name: Debug artifact structure
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          echo "=== Full workspace structure ==="
          find . -name "bb.exe" -type f 2>/dev/null | head -20
          echo "=== bb/dist contents ==="
          ls -laR bb/dist/ 2>/dev/null || echo "No bb/dist"
          echo "=== Checking expected paths ==="
          ls -la bb/dist/windows_windows_386/ 2>/dev/null || echo "No 386"
          ls -la bb/dist/windows_windows_amd64_v1/ 2>/dev/null || echo "No amd64"
          ls -la bb/dist/windows_windows_arm64/ 2>/dev/null || echo "No arm64"

      - name: Set up MSBuild
        id: setupmsbuild
        uses: microsoft/setup-msbuild@v3

      - name: Build MSI installers
        shell: bash
        env:
          MSBUILD_PATH: ${{ steps.setupmsbuild.outputs.msbuildPath }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          MSI_VERSION="${TAG_NAME#v}"
          # Strip prerelease suffix for WiX (e.g., 2.84.0-rc1 -> 2.84.0)
          MSI_VERSION="${MSI_VERSION%%-*}"
          echo "MSI Version: $MSI_VERSION"

          # Build for each architecture (GoReleaser adds version suffixes like _sse2, _v8.0)
          for arch_dir in dist/windows_windows_*; do
            case "$arch_dir" in
              *windows_386* )
                platform="x86"
                arch_suffix="386"
                ;;
              *windows_amd64* )
                platform="x64"
                arch_suffix="amd64"
                ;;
              *windows_arm64* )
                platform="arm64"
                arch_suffix="arm64"
                ;;
              * )
                echo "Skipping unknown architecture: $arch_dir"
                continue
                ;;
            esac

            MSI_NAME="bb_${MSI_VERSION}_windows_${arch_suffix}"
            echo "Building MSI for $platform: $MSI_NAME"

            "${MSBUILD_PATH}/MSBuild.exe" ./build/windows/bb.wixproj \
              -p:SourceDir="$PWD/$arch_dir" \
              -p:OutputPath="$PWD/dist" \
              -p:OutputName="$MSI_NAME" \
              -p:ProductVersion="$MSI_VERSION" \
              -p:Platform="$platform"
          done

      - name: Upload MSI installers
        uses: actions/upload-artifact@v7
        with:
          name: windows-msi
          if-no-files-found: error
          retention-days: 7
          path: bb/dist/*.msi

  # Create the GitHub release with all artifacts
  release:
    needs: [build, macos-pkg, windows-msi]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Prepare release assets
        working-directory: ${{ github.workspace }}
        run: |
          mkdir -p release

          # Copy main dist artifacts
          cp artifacts/dist/*.tar.gz release/ 2>/dev/null || true
          cp artifacts/dist/*.zip release/ 2>/dev/null || true
          cp artifacts/dist/*.deb release/ 2>/dev/null || true
          cp artifacts/dist/*.rpm release/ 2>/dev/null || true

          # Copy macOS PKG
          cp artifacts/macos-pkg/*.pkg release/ 2>/dev/null || true

          # Copy Windows MSI
          cp artifacts/windows-msi/*.msi release/ 2>/dev/null || true

          # Generate checksums for all files
          cd release
          shasum -a 256 * > checksums.txt

          echo "Release assets:"
          ls -la

      - name: Create GitHub Release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          # Determine if prerelease
          PRERELEASE_FLAG=""
          if [[ "$TAG_NAME" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          # Create release
          gh release create "$TAG_NAME" \
            --title "Bitbucket CLI ${TAG_NAME#v}" \
            --generate-notes \
            $PRERELEASE_FLAG \
            release/*

  # Update Homebrew tap
  homebrew:
    needs: release
    if: "!contains(github.ref_name, '-')"
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          gh release download "$TAG_NAME" --pattern "checksums.txt" --dir .

      - name: Update Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"

          # Extract checksums for each archive
          MACOS_ARM64_SHA=$(awk '/bb_'"${VERSION}"'_macOS_arm64\.zip$/ {print $1; exit}' checksums.txt)
          MACOS_AMD64_SHA=$(awk '/bb_'"${VERSION}"'_macOS_amd64\.zip$/ {print $1; exit}' checksums.txt)
          LINUX_ARM64_SHA=$(awk '/bb_'"${VERSION}"'_linux_arm64\.tar\.gz$/ {print $1; exit}' checksums.txt)
          LINUX_AMD64_SHA=$(awk '/bb_'"${VERSION}"'_linux_amd64\.tar\.gz$/ {print $1; exit}' checksums.txt)

          # Validate all checksums were found
          for var in MACOS_ARM64_SHA MACOS_AMD64_SHA LINUX_ARM64_SHA LINUX_AMD64_SHA; do
            eval "val=\${$var}"
            if [ -z "$val" ]; then
              echo "::error::Missing checksum for $var"
              exit 1
            fi
          done

          # Clone the tap repo
          git clone "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/dlbroadfoot/homebrew-tap.git" tap
          cd tap

          # Generate updated formula
          cat > Formula/bb.rb <<'EOF'
          # typed: false
          # frozen_string_literal: true

          class Bb < Formula
            desc "Bitbucket CLI - Work seamlessly with Bitbucket from the command line"
            homepage "https://github.com/dlbroadfoot/bitbucket-cli"
            version "VERSION_PLACEHOLDER"
            license "MIT"

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/dlbroadfoot/bitbucket-cli/releases/download/v#{version}/bb_#{version}_macOS_arm64.zip"
                sha256 "MACOS_ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/dlbroadfoot/bitbucket-cli/releases/download/v#{version}/bb_#{version}_macOS_amd64.zip"
                sha256 "MACOS_AMD64_SHA_PLACEHOLDER"
              end
            end

            on_linux do
              if Hardware::CPU.arm? && Hardware::CPU.is_64_bit?
                url "https://github.com/dlbroadfoot/bitbucket-cli/releases/download/v#{version}/bb_#{version}_linux_arm64.tar.gz"
                sha256 "LINUX_ARM64_SHA_PLACEHOLDER"
              else
                url "https://github.com/dlbroadfoot/bitbucket-cli/releases/download/v#{version}/bb_#{version}_linux_amd64.tar.gz"
                sha256 "LINUX_AMD64_SHA_PLACEHOLDER"
              end
            end

            def install
              if File.exist?("bb")
                bin.install "bb"
              else
                bb_binary = Dir.glob("*/bb").first || Dir.glob("bb_*/bb").first
                bin.install bb_binary => "bb" if bb_binary
              end
            end

            test do
              system "#{bin}/bb", "--version"
            end
          end
          EOF

          # Replace placeholders with actual values
          sed -i "s/VERSION_PLACEHOLDER/${VERSION}/g" Formula/bb.rb
          sed -i "s/MACOS_ARM64_SHA_PLACEHOLDER/${MACOS_ARM64_SHA}/g" Formula/bb.rb
          sed -i "s/MACOS_AMD64_SHA_PLACEHOLDER/${MACOS_AMD64_SHA}/g" Formula/bb.rb
          sed -i "s/LINUX_ARM64_SHA_PLACEHOLDER/${LINUX_ARM64_SHA}/g" Formula/bb.rb
          sed -i "s/LINUX_AMD64_SHA_PLACEHOLDER/${LINUX_AMD64_SHA}/g" Formula/bb.rb

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/bb.rb
          if git diff --cached --quiet; then
            echo "No formula changes to commit."
          else
            git commit -m "Update bb to ${VERSION}"
            git push
          fi

  # Update WinGet manifest
  winget:
    needs: release
    if: "!contains(github.ref_name, '-')"
    runs-on: windows-latest
    steps:
      - name: Update WinGet manifest
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: dlbroadfoot.bb
          installers-regex: '\.msi$'
          token: ${{ secrets.WINGET_PAT }}
